<html lang="en">
<head>

<title>Career agent — dispatch board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --steel:#DCE1E6; --card:#FFFFFF; --ink:#0E1620; --muted:#5B6875;
    --rule:#B9C2CB; --signal:#E8940C; --live:#1F7A55; --dead:#B23B32;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--steel); color:var(--ink);
    font:400 16px/1.5 Barlow, system-ui, sans-serif;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:20px 16px 72px}

  /* ---- console strip: the run's own status line ---- */
  .console{
    background:var(--ink); color:#EDF1F4; border-radius:3px;
    padding:14px 16px; display:flex; flex-wrap:wrap; gap:16px 28px; align-items:baseline;
  }
  .console h1{
    font:700 22px/1 'Barlow Condensed', sans-serif; letter-spacing:.08em;
    text-transform:uppercase; margin:0; flex:1 1 100%;
  }
  .console h1 span{color:var(--signal)}
  .stat{font:400 12px/1.4 'JetBrains Mono', monospace; color:#93A1AD}
  .stat b{display:block; font:600 20px/1.2 'JetBrains Mono', monospace; color:#EDF1F4}
  .stat.new b{color:var(--signal)}

  .sources{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
  .pill{
    font:400 11px/1 'JetBrains Mono', monospace; letter-spacing:.04em;
    border:1px solid var(--rule); background:var(--card); color:var(--muted);
    padding:5px 8px; border-radius:2px;
  }
  .pill.err{border-color:var(--dead); color:var(--dead)}
  .pill b{color:var(--ink)}

  /* ---- controls ---- */
  .controls{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 10px}
  input[type=search], select{
    font:400 14px/1 Barlow, sans-serif; color:var(--ink);
    border:1px solid var(--rule); background:var(--card);
    padding:9px 10px; border-radius:2px;
  }
  input[type=search]{flex:1 1 220px; min-width:0}
  .toggle{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    border:1px solid var(--rule); background:var(--card);
    padding:9px 11px; border-radius:2px; font-size:14px; user-select:none;
  }
  .toggle input{accent-color:var(--signal); margin:0}
  :focus-visible{outline:2px solid var(--signal); outline-offset:2px}

  .count{font:400 12px/1 'JetBrains Mono', monospace; color:var(--muted); margin:0 0 12px}

  /* ---- the docket: signature element ---- */
  .docket{
    display:grid; grid-template-columns:54px 1fr; background:var(--card);
    border:1px solid var(--rule); border-radius:3px; margin-bottom:8px; overflow:hidden;
  }
  .meter{
    background:#F4F6F8; border-right:1px solid var(--rule);
    display:flex; flex-direction:column-reverse; gap:2px; padding:8px 0; align-items:center;
    position:relative;
  }
  .seg{width:18px; height:7px; background:#DDE3E8; border-radius:1px}
  .seg.on{background:var(--live)}
  .meter.mid .seg.on{background:var(--signal)}
  .meter.low .seg.on{background:#98A5B0}
  .meter .num{
    position:absolute; bottom:-1px; left:0; right:0; text-align:center;
    font:600 13px/1 'JetBrains Mono', monospace; padding:6px 0 8px; background:#F4F6F8;
  }
  .body{padding:12px 14px 13px}
  .row1{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .role{font:600 18px/1.25 'Barlow Condensed', sans-serif; letter-spacing:.02em; margin:0}
  .role a{color:inherit; text-decoration:none; border-bottom:2px solid var(--signal)}
  .role a:hover{color:var(--dead)}
  .flag{
    font:600 10px/1 'JetBrains Mono', monospace; letter-spacing:.1em; text-transform:uppercase;
    background:var(--signal); color:#1A1206; padding:4px 6px; border-radius:2px;
  }
  .meta{font:400 12px/1.6 'JetBrains Mono', monospace; color:var(--muted); margin:4px 0 0}
  .reason{margin:8px 0 0; font-size:15px}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 0}
  .tag{font:400 11px/1 'JetBrains Mono', monospace; padding:5px 7px; border-radius:2px; border:1px solid}
  .tag.hit{border-color:#A9CDBB; background:#EEF6F1; color:var(--live)}
  .tag.gap{border-color:#E4C79B; background:#FDF5E8; color:#8A5B10}
  .tag.stop{border-color:#E0AEA9; background:#FBEEEC; color:var(--dead)}
  .next{
    margin:10px 0 0; padding:9px 11px; background:#F4F6F8;
    border-left:3px solid var(--ink); font-size:14px;
  }
  details summary{
    cursor:pointer; font:600 12px/1 'JetBrains Mono', monospace; color:var(--muted);
    margin:10px 0 0; list-style:none;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:'+ '; color:var(--signal)}
  details[open] summary::before{content:'– '}
  details p{font-size:14px; color:#33404C; margin:8px 0 0}

  .empty{background:var(--card); border:1px solid var(--rule); padding:28px; text-align:center}
  .empty h2{font:600 20px/1.2 'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px}
  .empty p{color:var(--muted); margin:0 auto; max-width:44ch}
  footer{margin:26px 0 0; font:400 12px/1.6 'JetBrains Mono', monospace; color:var(--muted)}

  @media (max-width:520px){
    .console h1{font-size:19px}
    .stat b{font-size:17px}
    .docket{grid-template-columns:44px 1fr}
    .seg{width:14px}
  }
  @media (prefers-reduced-motion:no-preference){
    .docket{animation:in .28s ease both}
    @keyframes in{from{opacity:0; transform:translateY(4px)}}
  }
</style>
</head>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// "zurich" must find "Zürich", and "goteborg" must find "Göteborg".
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let report = { jobs: [] };

function meter(score){
  const lit = Math.round(score / 10);
  const tone = score >= 75 ? '' : score >= 55 ? ' mid' : ' low';
  const segs = Array.from({length:10}, (_,i) => `<i class="seg${i < lit ? ' on' : ''}"></i>`).join('');
  return `<div class="meter${tone}">${segs}<span class="num">${score}</span></div>`;
}

function tags(list, kind, limit = 6){
  return (list || []).slice(0, limit).map(t => `<span class="tag ${kind}">${esc(t)}</span>`).join('');
}

function docket(j){
  const where = [j.location, j.remote ? 'remote' : ''].filter(Boolean).join(' · ') || 'location not stated';
  const posted = j.posted ? new Date(j.posted).toISOString().slice(0,10) : 'date unknown';
  const pay = j.salary_text || (j.salary_min ? `${Math.round(j.salary_min).toLocaleString()}–${Math.round(j.salary_max || j.salary_min).toLocaleString()}` : '');
  return `<article class="docket">
    ${meter(j.score ?? 0)}
    <div class="body">
      <div class="row1">
        <h2 class="role"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
        ${j.isNew ? '<span class="flag">new</span>' : ''}
      </div>
      <p class="meta">${esc(j.company)} — ${esc(where)} — ${esc(posted)} — ${esc((j.sources||[j.source]).join('/'))}${pay ? ' — ' + esc(pay) : ''}${j.scoredBy === 'prefilter' ? ' — keyword score only' : ''}</p>
      ${j.reason ? `<p class="reason">${esc(j.reason)}</p>` : ''}
      <div class="tags">${tags(j.matched,'hit')}${tags(j.gaps,'gap',4)}${tags(j.disqualifiers,'stop',3)}</div>
      ${j.next_action ? `<p class="next">${esc(j.next_action)}</p>` : ''}
      ${j.description ? `<details><summary>Advertisement text</summary><p>${esc(j.description.slice(0,1400))}</p></details>` : ''}
    </div>
  </article>`;
}

function render(){
  const q = fold($('q').value.trim());
  const country = $('country').value;
  const min = Number($('fit').value);
  const onlyNew = $('onlyNew').checked;
  const sort = $('sort').value;

  let rows = report.jobs.filter(j =>
    (j.score ?? 0) >= min &&
    (!onlyNew || j.isNew) &&
    (!country || j.country === country) &&
    (!q || fold(`${j.title} ${j.company} ${(j.matched||[]).join(' ')} ${j.location}`).includes(q))
  );

  rows.sort((a,b) =>
    sort === 'company' ? a.company.localeCompare(b.company)
    : sort === 'date' ? new Date(b.posted || 0) - new Date(a.posted || 0)
    : (b.score||0) - (a.score||0));

  $('count').textContent = `${rows.length} of ${report.jobs.length} shown`;
  $('list').innerHTML = rows.length
    ? rows.map(docket).join('')
    : `<div class="empty"><h2>Nothing matches this filter</h2><p>Clear the search box, or lower the score cut-off. If every run comes back empty, widen the sources in <code>config/settings.json</code>.</p></div>`;
}

function head(){
  const when = report.generatedAt ? new Date(report.generatedAt) : null;
  $('s-when').textContent = when ? when.toISOString().slice(0,16).replace('T',' ') : 'never';
  $('s-collected').textContent = report.totalCollected ?? 0;
  $('s-matched').textContent = report.totalMatched ?? 0;
  $('s-new').textContent = report.totalNew ?? 0;
  $('s-profile').textContent = report.profileSummary?.headline || '—';
  $('sources').innerHTML = (report.sources || []).map(s =>
    `<span class="pill${s.status === 'ok' ? '' : ' err'}">${esc(s.source)} <b>${s.collected}</b>${s.status === 'ok' ? '' : ' · ' + esc(s.status)}</span>`).join('');

  const NAMES = { ch: 'Switzerland', de: 'Germany', at: 'Austria', se: 'Sweden', no: 'Norway', fr: 'France' };
  const counts = new Map();
  for (const j of report.jobs || []) if (j.country) counts.set(j.country, (counts.get(j.country) || 0) + 1);
  $('country').innerHTML = `<option value="">All countries (${report.jobs?.length ?? 0})</option>` +
    [...counts.entries()].sort((a, b) => b[1] - a[1])
      .map(([c, n]) => `<option value="${esc(c)}">${esc(NAMES[c] || c.toUpperCase())} (${n})</option>`).join('');

  $('foot').textContent = report.searchedQueries?.length
    ? `Searched: ${report.searchedQueries.join(' · ')} — scores are advisory, not a hiring decision.`
    : 'Scores are advisory, not a hiring decision.';
}

// report.html ships with the data baked in; index.html fetches it alongside.
const embedded = document.getElementById('report-data');
if (embedded) {
  report = JSON.parse(embedded.textContent);
} else {
  try {
    const r = await fetch('./latest.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    report = await r.json();
  } catch {
    $('list').innerHTML = `<div class="empty"><h2>No report to show</h2><p>This page reads <code>latest.json</code> from the same folder, which a browser blocks when the file is opened from disk. Use <code>docs/report.html</code> instead — it carries its own data.</p></div>`;
  }
}
head();
if (report.jobs?.length) render();
for (const el of ['q','country','fit','sort','onlyNew']) $(el).addEventListener('input', render);
</script>
</body>
</html>
