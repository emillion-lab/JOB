name: Career Agent

on:
  workflow_dispatch:
    inputs:
      countries:
        description: Which markets to search
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'ch'
          - 'no'
          - 'ch,no'
          - 'de,at'
          - 'ch,de,at'
      languages:
        description: Advertisement language
        type: choice
        default: 'as configured'
        options: ['as configured', 'en', 'en,no', 'en,de', 'any']
      min_score:
        description: Lowest score to report
        type: choice
        default: '40'
        options: ['30', '35', '40', '45', '55']
      max_age_days:
        description: How far back to look
        type: choice
        default: '60'
        options: ['14', '30', '60', '90']
      use_model:
        description: Score with the language model (needs LLM_API_KEY and credit)
        type: choice
        default: 'as configured'
        options: ['as configured', 'true', 'false']
      rebuild_profile:
        description: Rebuild the profile from the CV first (needs an API key)
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: career-agent
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    env:
      CV_TEXT_B64: ${{ secrets.CV_TEXT_B64 }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      NAV_TOKEN: ${{ secrets.NAV_TOKEN }}
      REBUILD_PROFILE: ${{ inputs.rebuild_profile }}
      # Sentinels ("all", "as configured") are interpreted in loadSettings,
      # because Actions expressions have no ternary and drop empty strings.
      OVERRIDE_COUNTRIES: ${{ inputs.countries }}
      OVERRIDE_LANGUAGES: ${{ inputs.languages }}
      OVERRIDE_MIN_SCORE: ${{ inputs.min_score }}
      OVERRIDE_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
      OVERRIDE_USE_LLM: ${{ inputs.use_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Checks only what this configuration actually needs, and says what is missing.
      - name: Preflight
        run: npm run preflight

      - name: Unit tests
        run: npm test

      - name: Find and rank jobs
        run: npm run run

      # data/profile.json is CV-derived and gitignored. It stays in the run only.
      - name: Keep the profile out of git, available for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: career-profile
          path: data/profile.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Publish report
        run: |
          git config user.name  "career-agent[bot]"
          git config user.email "career-agent[bot]@users.noreply.github.com"
          git add -A data docs   # cv.txt and profile.json are gitignored
          git diff --cached --quiet || git commit -m "bot: refresh job matches"
          git push
